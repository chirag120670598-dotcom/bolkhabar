[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bolkhabar"
version = "0.1.0"
description = "Turn one podcast transcript into a thread, blog post, newsletter, show notes, shorts and SEO. Offline, free, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chirag Solanki" }]
keywords = [
  "podcast", "transcript", "content", "repurposing", "twitter-thread",
  "show-notes", "seo", "shorts", "creator-tools", "hinglish", "india",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
polish = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
bolkhabar = "bolkhabar.cli:main"

[project.urls]
Homepage = "https://github.com/chirag120670598-dotcom/bolkhabar"
Issues = "https://github.com/chirag120670598-dotcom/bolkhabar/issues"

[tool.setuptools.packages.find]
include = ["bolkhabar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
